version: '3.8'

services:
  # Redis 메모리 저장소
  redis:
    image: redis:7-alpine
    container_name: tms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - tms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # TMS Router AI Chalice API 서버
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tms-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
    volumes:
      - /app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tms-network
    restart: unless-stopped
    command: chalice local --host 0.0.0.0 --port 8000 --no-autoreload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit 웹 UI
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tms-web
    ports:
      - "8501:8501"
    environment:
      - CHALICE_API_URL=http://api:8000
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tms-network
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Commander (Redis 관리 도구, 선택사항)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tms-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - tms-network
    # profiles:
    #   - tools  # docker-compose --profile tools up 으로 실행

volumes:
  redis_data:
    driver: local

networks:
  tms-network:
    driver: bridge